name: code-review-agent-system

services:
  migrate:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: migration
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"
    command: ["pnpm", "db:migrate"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379/0
      WEB_SERVICE_URL: http://web:3000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
    depends_on:
      web:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - app

  sandbox-controller:
    build:
      context: ./apps/sandbox-controller
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY}
      SANDBOX_CPUS: ${SANDBOX_CPUS}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT}
      SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_COMMAND_TIMEOUT_SECONDS}
      SANDBOX_MAX_LIFETIME_SECONDS: ${SANDBOX_MAX_LIFETIME_SECONDS}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK}
      SANDBOX_LABEL_PREFIX: ${SANDBOX_LABEL_PREFIX}
      SANDBOX_CONTROLLER_TOKEN: ${SANDBOX_CONTROLLER_TOKEN}
    volumes:
      # here this is intentionally the ONLY Docker socket mount
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app
    ports:
      - "8000:8000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    restart: unless-stopped
    environment:
      DFLY_requirepass: ${REDIS_PASSWORD}
    command:
      - --maxmemory=256mb
      - --dir=/data
      - --dbfilename=jobs-dump
      # no need for the http console
      - --primary_port_http_enabled=false
    volumes:
      - dragonfly-data:/data
    networks:
      - app
    # leave room above maxmemory is for internal management
    mem_limit: 512m
    cpus: 0.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: drizzle-studio
    restart: always
    environment:
      MASTERPASS: ${DRIZZLE_STUDIO_PASSWORD}
    ports:
      - '4983:4983'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    command: ['sh', '-c', 'pnpm db:studio --host=0.0.0.0 --port=4983']
    volumes:
      - drizzle_studio:/app

volumes:
  dragonfly-data:
  postgres_data:
  drizzle_studio:

networks:
  app:
    driver: bridge

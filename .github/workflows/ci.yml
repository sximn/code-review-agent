name: CI

on: [push]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and node
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: apps/web
          version: 12.4.1
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Use example env file
        run: |
          cp .env.example .env

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python-services:
    name: Python / ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: worker
            directory: apps/worker
          - service: sandbox-controller
            directory: apps/sandbox-controller

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1

      - name: Setup uv and python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          working-directory: ${{ matrix.directory }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.directory }}/uv.lock
          cache-suffix: ${{ matrix.service }}

      - name: Use example env file
        run: |
          cp .env.example .env

      - run: uv sync --locked --all-groups
      - run: uv run --no-sync python -m pytest --cov=src --cov-report=term-missing

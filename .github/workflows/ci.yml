name: CI

on: [push]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and node
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: apps/web
          version: 12.4.1
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Use example env file
        run: |
          cp .env.example .env

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:check
      - run: pnpm build

  python-services:
    name: Python / ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: worker
            directory: apps/worker
          - service: sandbox-controller
            directory: apps/sandbox-controller

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1

      - name: Setup uv and python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          working-directory: ${{ matrix.directory }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.directory }}/uv.lock
          cache-suffix: ${{ matrix.service }}

      - name: Use example env file
        run: |
          cp .env.example .env

      - run: uv sync --locked --all-groups
      - run: uv run --no-sync python -m pytest --cov=src --cov-report=term-missing
      - if: matrix.service == 'sandbox-controller'
        run: uv run --no-sync python -m scripts.check_openapi ../../contracts/sandbox-controller.openapi.json

  internal-contract-integration:
    name: Internal API contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      BETTER_AUTH_SECRET: contract-test-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: contract-test-google-client
      GOOGLE_CLIENT_SECRET: contract-test-google-secret
      GITHUB_CLIENT_ID: contract-test-github-client
      GITHUB_CLIENT_SECRET: contract-test-github-secret
      JOB_STREAM: contract-test-jobs
      REVIEW_JOB_NAME: pr-review
      WORKER_API_TOKEN: contract-test-worker-token-at-least-32-characters
      WEB_CONTRACT_TEST_URL: http://127.0.0.1:3000
      WEB_CONTRACT_TEST_TOKEN: contract-test-worker-token-at-least-32-characters

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and node
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: apps/web
          version: 12.4.1
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup uv and python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          working-directory: apps/worker
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
          cache-suffix: worker-contract

      - name: Build and seed web
        working-directory: apps/web
        run: |
          pnpm db:migrate
          pnpm contracts:test:seed
          pnpm build

      - name: Install worker dependencies
        working-directory: apps/worker
        run: uv sync --locked --all-groups

      - name: Exercise worker to web boundary
        run: |
          cd apps/web
          HOSTNAME=127.0.0.1 node .next/standalone/server.js > "$RUNNER_TEMP/contract-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/contract-web.log"
              exit 1
            fi
            sleep 1
          done
          cd ../worker
          uv run --no-sync python -m pytest tests/test_web_contract_integration.py
      - name: Show web logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/contract-web.log" ]; then
            cat "$RUNNER_TEMP/contract-web.log"
          fi
